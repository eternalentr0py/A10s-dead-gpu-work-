name: build-softgfx

on:
  workflow_dispatch:
    inputs:
      mesa_tag:
        description: "Mesa git tag"
        default: "mesa-21.3.9"
        required: true
      ndk:
        description: "NDK version"
        default: "r25c"
        required: true

permissions:
  contents: write

jobs:
  stage1-mesa-softpipe:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-mako python3-setuptools ninja-build bison flex git patchelf
          pip3 install --user meson mako PyYAML
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ inputs.ndk }}

      - name: Build Mesa softpipe (armeabi-v7a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: stage1/build_mesa.sh "${{ inputs.mesa_tag }}" "$GITHUB_WORKSPACE/out"

      - name: Build EGL shim, GLES stub, egltest; package flat test bundle
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TC/armv7a-linux-androideabi30-clang++"; CC="$TC/armv7a-linux-androideabi30-clang"
          D="$GITHUB_WORKSPACE/out/vendor_root/vendor/lib"
          # Mesa's own EGL becomes the "real" backend; our shim takes the libEGL_soft.so name
          mv "$D/egl/libEGL_soft.so" "$D/egl/libEGL_mesa_real.so"
          patchelf --set-soname libEGL_mesa_real.so "$D/egl/libEGL_mesa_real.so"
          rm -f "$D/egl/libGLESv2_soft.so"
          # shim
          "$CXX" -std=c++17 -O2 -fPIC -shared -fvisibility=hidden -Wall -Wno-misleading-indentation \          path: |
            out/softgfx-installer.zip
            out/softgfx-uninstaller.zip
            out/softgfx-test-bundle.zip
          # GLES2 stub: plain C, only the two intercepted entry points; links to the shim
          "$CC" -O2 -fPIC -shared -fvisibility=hidden -Wl,-soname,libGLESv2_soft.so -Wl,--build-id=none \
            -o "$D/egl/libGLESv2_soft.so" stage2/eglshim/gles2_stub.c -L"$D/egl" -l:libEGL_soft.so 2>&1 | tee -a out/shim-build.log
          "$TC/llvm-strip" --strip-unneeded "$D/egl/libEGL_soft.so" "$D/egl/libGLESv2_soft.so"
          # egltest (dynamic; dlopens the libs by path)
          "$CC" -O2 -Wall -o out/egltest tools/egltest.c -ldl 2>&1 | tee out/egltest-build.log
          # flat bundle: push its CONTENTS straight into /tmp/softgfx
          mkdir -p out/bundle
          cp out/egltest tools/run_test.sh out/bundle/
          cp -r out/vendor_root out/bundle/vendor_root
          chmod 755 out/bundle/egltest out/bundle/run_test.sh
          (cd out/bundle && zip -qr -X ../softgfx-test-bundle.zip egltest run_test.sh vendor_root)
          unzip -l out/softgfx-test-bundle.zip
          for f in "$D"/egl/*.so; do echo "# $f"; "$TC/llvm-readelf" -d "$f" | grep -E "SONAME|NEEDED"; done > out/elf-report-final.txt

      - name: Package TWRP installer and uninstaller
        run: |
          VER="softgfx $(date -u +%Y-%m-%d) ${GITHUB_SHA::7}"
          for MODE in install uninstall; do
            R="out/pkg-$MODE"; rm -rf "$R"; mkdir -p "$R/META-INF/com/google/android"
            sed -e "s/@MODE@/$MODE/g" -e "s/@VERSION@/$VER/g" installer/update-binary.in > "$R/META-INF/com/google/android/update-binary"
            cp installer/updater-script "$R/META-INF/com/google/android/updater-script"
            if [ "$MODE" = install ]; then mkdir -p "$R/files"; cp -r out/vendor_root/vendor "$R/files/vendor"; fi
            chmod 755 "$R/META-INF/com/google/android/update-binary"
            (cd "$R" && zip -qr -X "../softgfx-$MODE" .)
          done
          mv out/softgfx-install.zip out/softgfx-installer.zip; mv out/softgfx-uninstall.zip out/softgfx-uninstaller.zip
          unzip -l out/softgfx-installer.zip
          # sanity: every NEEDED lib of our libs is either shipped or a platform lib
          cd out/vendor_root/vendor/lib/egl && for f in *.so; do readelf -d "$f" 2>/dev/null | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' ; done | sort -u > ../../../../needed.txt
          echo "needed libs:"; cat ../../../../needed.txt

      - name: Push logs to ci-logs branch (so they can be read without blob access)
        if: always()
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci && rm -rf r && git init -q r && cd r
          git config user.name "ci"; git config user.email "ci@example.invalid"
          mkdir -p logs
          for f in "$GITHUB_WORKSPACE"/out/*.log "$GITHUB_WORKSPACE"/out/*.txt; do [ -f "$f" ] && tail -n 300 "$f" > "logs/$(basename "$f")"; done
          [ -f "$GITHUB_WORKSPACE/work/build/meson-logs/meson-log.txt" ] && tail -n 300 "$GITHUB_WORKSPACE/work/build/meson-logs/meson-log.txt" > logs/meson-log.txt
          echo "run ${{ github.run_id }} mesa=${{ inputs.mesa_tag }} ndk=${{ inputs.ndk }}" > logs/RUN.txt
          git add -A; git commit -q -m "logs for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-logs

      - name: Upload .so files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: softgfx-stage1-armv7
          path: |
            out/softgfx-test-bundle.zip
            out/elf-report-final.txt
          if-no-files-found: warn

      - name: Publish logs to ci-logs branch (readable without artifact download)
        if: always()
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci && rm -rf repo && git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git checkout --orphan ci-logs-new 2>/dev/null || git checkout -b ci-logs-new
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p logs
          for f in "$GITHUB_WORKSPACE"/out/*.log "$GITHUB_WORKSPACE"/out/*.txt; do
            [ -f "$f" ] && tail -n 400 "$f" > "logs/$(basename "$f")"
          done
          for f in "$GITHUB_WORKSPACE"/work/build/meson-logs/meson-log.txt; do
            [ -f "$f" ] && tail -n 200 "$f" > "logs/meson-log-tail.txt"
          done
          echo "run ${{ github.run_id }} status ${{ job.status }}" > logs/RUN.txt
          git config user.name ci; git config user.email ci@example.invalid
          git add logs; git commit -m "logs for run ${{ github.run_id }}" >/dev/null
          git push -f origin HEAD:ci-logs
