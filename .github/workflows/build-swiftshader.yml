name: build-swiftshader

on:
  workflow_dispatch:
    inputs:
      swiftshader_ref:
        description: "SwiftShader git ref (tag, branch, or commit)"
        default: "main"
        required: true
      ndk:
        description: "NDK version"
        default: "r25c"
        required: true

permissions:
  contents: write

jobs:
  stage2-swiftshader:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build git patchelf zip

      - name: Set up NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ inputs.ndk }}

      - name: Build SwiftShader (armeabi-v7a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: stage2/build_swiftshader.sh "${{ inputs.swiftshader_ref }}" "$GITHUB_WORKSPACE/out"

      - name: Build egltest and package smoke-test bundle
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TC/armv7a-linux-androideabi30-clang" -O2 -Wall -static -o out/egltest_static tools/egltest.c -ldl 2>&1 | tee out/egltest-build-static.log || true
          patchelf --set-interpreter "" out/egltest_static 2>/dev/null || true
          readelf -l out/egltest_static | grep -E "INTERP|interpreter" || echo "no interpreter - good"
          "$TC/armv7a-linux-androideabi30-clang" -O2 -Wall -o out/egltest tools/egltest.c -ldl 2>&1 | tee out/egltest-build.log

          mkdir -p out/bundle
          cp out/egltest_static   out/bundle/egltest
          cp tools/run_egltest.sh out/bundle/run_egltest.sh
          cp -r out/vendor_root    out/bundle/vendor_root
          cd out && zip -qr softgfx-swiftshader-bundle.zip bundle/ && echo "bundle contents:" && unzip -l softgfx-swiftshader-bundle.zip

      - name: Determine release tag
        id: tag
        run: echo "tag=swiftshader-${{ inputs.swiftshader_ref }}-run${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish logs to ci-logs branch (readable without downloading a release asset)
        if: always()
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci && rm -rf repo
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git checkout ci-logs 2>/dev/null || git checkout --orphan ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p logs
          for f in "$GITHUB_WORKSPACE"/out/*.log "$GITHUB_WORKSPACE"/out/*.txt; do
            [ -f "$f" ] && cp "$f" "logs/swiftshader-$(basename "$f")"
          done
          echo "run ${{ github.run_id }} swiftshader_ref=${{ inputs.swiftshader_ref }} ndk=${{ inputs.ndk }} status ${{ job.status }}" > logs/SWIFTSHADER_RUN.txt
          git config user.name ci; git config user.email ci@example.invalid
          git add -A; git commit -m "swiftshader logs for run ${{ github.run_id }}" >/dev/null || echo "nothing to commit"
          git push -f origin HEAD:ci-logs

      - name: Publish Release with built artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          ASSETS=()
          for f in out/softgfx-swiftshader-bundle.zip out/elf-report.txt out/cmake-configure.log out/ninja-build.log out/egltest-build.log out/egltest-build-static.log; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No build outputs found; skipping release publish."
            exit 0
          fi

          gh release create "${{ steps.tag.outputs.tag }}" \
            "${ASSETS[@]}" \
            --title "SwiftShader armeabi-v7a build (${{ inputs.swiftshader_ref }}, run ${{ github.run_number }})" \
            --notes "Automated build from \`stage2/build_swiftshader.sh\` on branch \`${{ github.ref_name }}\`.

          - swiftshader_ref: \`${{ inputs.swiftshader_ref }}\`
          - ndk: \`${{ inputs.ndk }}\`
          - job status: \`${{ job.status }}\`

          **Not yet tested on a device.** This is a GLES/EGL backend only - see \`stage2/README.md\`
          and \`docs/ARCHITECTURE.md\` for what else is still required (gralloc replacement, HWC
          fallback, vintf/init wiring, TWRP installer zip) before this can run real SurfaceFlinger
          on the device. \`softgfx-swiftshader-bundle.zip\` contains a standalone \`egltest\` binary
          you can push to the device (via adb/TWRP) to confirm an EGL context initializes, before
          any of that further work." \
            --prerelease
